name: Python

on:
  push:
    branches: [main]
    paths:
      - crates/**/*.rs
      - "!crates/img-gen/tests/*.rs"
      - crates/img-gen/tests/*.py
      - pyproject.toml
      - docs/
      - .github/workflows/python.yml
    tags: ["img-gen-py/v*"]
  pull_request:
    branches: [main]
    paths:
      - crates/**/*.rs
      - "!crates/img-gen/tests/*.rs"
      - crates/img-gen/tests/*.py
      - pyproject.toml
      - docs/
      - .github/workflows/python.yml

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  wheels:
    runs-on: ${{ matrix.platform.runner }}
    name: >-
      wheels (${{ matrix.python.feature }},
      ${{ matrix.platform.runner }},
      ${{ matrix.platform.manylinux || '-' }}
      ${{ matrix.platform.target }})
    strategy:
      fail-fast: false
      matrix:
        python:
          - version: '3.10'
            feature: pyo3/abi3-py310
          - version: '3.15t'
            feature: pyo3/abi3t-py315
        platform:
          - runner: windows-latest
            target: x64
            py-arch: x64
          - runner: windows-latest
            target: x86
            py-arch: x86
          - runner: macos-15-intel
            target: x86_64
          - runner: macos-15
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
          - runner: ubuntu-latest
            target: x86
          - runner: ubuntu-latest
            target: aarch64
          - runner: ubuntu-latest
            target: x86_64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: x86
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: aarch64
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: armv7
            manylinux: musllinux_1_2
          - runner: ubuntu-latest
            target: s390x
          - runner: ubuntu-latest
            target: ppc64le
        include:
          # insert these manually until python 3.11 is the minimum supported python version
          - python:
              version: '3.11'
              feature: pyo3/abi3-py311
            platform:
              runner: windows-11-arm
              target: aarch64
              py-arch: arm64
          - python:
              version: '3.15t'
              feature: pyo3/abi3t-py315
            platform:
              runner: windows-11-arm
              target: aarch64
              py-arch: arm64
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: ${{ matrix.python.version }}
          architecture: ${{ matrix.python.py-arch || null }}
      - name: Build wheels
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.platform.target }}
          # Use the zig toolchain for all targets except linux ppc64le.
          # Note, this is meant to avoid build errors in aws-lc-sys crate, which compiles C code.
          # For using reqwest v0.13 with `default-tls` feature.
          args: >-
            --release
            --out dist
            --interpreter ${{ matrix.python.version }}
            --features ${{ matrix.python.feature }}
            ${{ runner.os == 'Linux' && matrix.platform.target != 'ppc64le' && '--zig' || '' }}
          sccache: ${{ !startsWith(github.ref, 'refs/tags/') }} # zizmor: ignore[cache-poisoning]
          manylinux: ${{ matrix.platform.manylinux || 'auto' }}
          # here we either install the ppc64le compiler/toolchain or use zig on all others
          # spell-checker: disable
          before-script-linux: |
            case "${{ matrix.platform.target }}" in
              ppc64le)
                apt-get update
                apt-get install -y \
                  pkg-config \
                  gcc-powerpc64le-linux-gnu \
                  g++-powerpc64le-linux-gnu \
                  binutils-powerpc64le-linux-gnu \
                  libc6-dev-ppc64el-cross \
                  libfontconfig1-dev
                ;;
            esac
          # spell-checker: enable
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-${{ runner.os }}-${{ matrix.platform.target }}_${{ matrix.platform.manylinux || '' }}-${{ matrix.python.version }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Build sdist
        uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - run: rustup update
      - uses: actions/setup-python@v7.1.0
        id: python-setup
        with:
          python-version: 3.x
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        # zizmor: ignore[cache-poisoning]
        with:
          python-version: ${{ steps.python-setup.outputs.python-version }}
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
      - name: Install nur
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall -y nur
      - name: Run tests
        run: nur test py

  release:
    name: Release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/img-gen-py/v')
    needs: [wheels, sdist]
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          skip-existing: true

  docs:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
      - uses: cargo-bins/cargo-binstall@81df5c23b0dc775b009efdfc9895c5965b7a4e40 # v1.26.1
      - name: Install nur
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall -y nur
      - name: Install uv
        # zizmor: ignore[cache-poisoning]
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build docs
        run: nur docs
      - name: Upload docs
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy-docs:
    name: Deploy docs
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: docs
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        id: deploy-pages

  check-dist:
    needs: [wheels, sdist]
    if: ${{ !startsWith(github.ref, 'refs/tags/img-gen-py/v') }}
    name: Check package dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: 3.x
      - name: Check distributions
        # spell-checker: disable-next-line
        run: pipx run twine check dist/*
