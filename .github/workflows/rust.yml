name: Rust

on:
  push:
    branches: [main]
    tags:
      - "img-gen/v*"
      - "img-gen-spec/v*"
      - "img-gen-renderer/v*"
    paths:
      - crates/**
      - .github/workflows/rust.yml
      - Cargo.{toml,lock}
  pull_request:
    branches: [main]
    paths:
      - crates/**
      - .github/workflows/rust.yml
      - Cargo.{toml,lock}

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup update --no-self-update
      - name: Cache cargo artifacts
        uses: actions/cache@v5.0.5 # zizmor: ignore[cache-poisoning]
        with:
          path: "~/.cargo"
          key: cargo-lint-${{ hashFiles('Cargo.lock') }}
      - run: cargo clippy --all-features -- -D warnings
      - run: cargo fmt --check

  doc:
    name: Rust docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup update --no-self-update
      - name: Cache cargo artifacts
        uses: actions/cache@v5.0.5 # zizmor: ignore[cache-poisoning]
        with:
          path: "~/.cargo"
          key: cargo-doc-${{ hashFiles('Cargo.lock') }}
      - run: cargo doc --no-deps ${PACKAGES}
      - name: Upload docs as artifact
        uses: actions/upload-artifact@v7
        with:
          path: target/doc
          name: rust-docs

  test:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup update --no-self-update
      - run: rustup component add llvm-tools-preview
      - name: Cache cargo artifacts
        uses: actions/cache@v5.0.5 # zizmor: ignore[cache-poisoning]
        with:
          path: "~/.cargo"
          key: cargo-test-${{ hashFiles('Cargo.lock') }}
      - uses: cargo-bins/cargo-binstall@aaa84a43aec4955a42c5ffc65d258961e39f276e # v1.19.1
      - name: Install cargo-nextest, cargo-llvm-cov, and nur
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: cargo binstall -y cargo-nextest cargo-llvm-cov nur
      - name: Run tests
        run: nur test
      - name: Generate coverage report
        run: nur test lcov
      - name: Upload coverage report as artifact
        uses: actions/upload-artifact@v7
        with:
          path: lcov.info
          name: test-coverage

  coverage:
    needs: [test]
    runs-on: ubuntu-latest
    environment:
      name: test-coverage
      url: https://app.codecov.io/gh/2bndy5/img-gen
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: test-coverage
      - uses: codecov/codecov-action@e79a6962e0d4c0c17b229090214935d2e33f8354 # v6.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: lcov.info
          fail_ci_if_error: true

  release:
    needs: [lint, doc, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment: release
    name: Release ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup update --no-self-update
      - name: Setup nushell
        uses: hustcer/setup-nu@92c296ba1ba2ba04cc948ab64ddefe192dc13f0c # v3.23
        with:
          version: ${{ vars.NUSHELL_VERSION || '*' }}
      - name: Get package name
        id: translate
        shell: nu {0}
        env:
          TAG: ${{ github.ref_name }}
        run: |-
          let pkg = $env.TAG | parse "{pkg}/{_}" | first | get "pkg"
          let name = (
            open $"${{ github.workspace }}/crates/($pkg)/Cargo.toml"
            | get package
            | get name
          )
          $"pkg=($name)\n" | save --append $env.GITHUB_OUTPUT
      - name: Establish provenance
        uses: rust-lang/crates-io-auth-action@bbd81622f20ce9e2dd9622e3218b975523e45bbe # v1.0.4
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, matrix.pkg)
        id: auth
      - name: Publish crate ${{ steps.translate.outputs.pkg }}
        if: startsWith(github.ref, 'refs/tags/') && startsWith(github.ref_name, matrix.pkg)
        env:
          PKG_NAME: ${{ steps.translate.outputs.pkg }}
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish -p $PKG_NAME

  check-dist:
    needs: [lint, doc, test]
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    name: Check package dist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
      - run: rustup update --no-self-update
      - name: Package crates (dry run)
        # zizmor: ignore[use-trusted-publishing]
        run: cargo publish --workspace --dry-run
