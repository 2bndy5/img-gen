[workspace]
resolver = "2"
members = [
    "crates/img-gen-spec",
    "crates/img-gen-renderer",
    "crates/img-gen",
]

[workspace.package]
edition = "2024"
authors = ["Brendan Doherty"]
license = "MIT"
repository = "https://github.com/2bndy5/img-gen"
homepage = "https://2bndy5.github.io/img-gen"

[workspace.dependencies]
fontsource_downloader = "0.3.1"
parley = { version = "0.11.0", default-features = false, features = ["std"] }
pyo3 = "0.29.0"
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.52.3", features = ["macros"] }

[workspace.dependencies.serde-saphyr]
version = "0.0.28"
# git = "https://github.com/bourumir-wyngs/serde-saphyr.git"
# rev = "4973d226f6130391f0330480cd8d64903517375c"
