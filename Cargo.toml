[workspace]
resolver = "2"
members = [
    "crates/img-gen-spec",
    "crates/img-gen-renderer",
    "crates/img-gen",
]

[workspace.package]
edition = "2024"
authors = ["Brendan Doherty"]
license = "MIT"
repository = "https://github.com/2bndy5/img-gen"
homepage = "https://2bndy5.github.io/img-gen"

[workspace.dependencies]
fontsource_downloader = "0.3.3"
parley = { version = "0.12.0", default-features = false, features = ["std"] }
pyo3 = "0.29.3"
serde_json = "1.0"
serde-saphyr = "1.3.0"
thiserror = "2.0"
tokio = { version = "1.53.2", features = ["macros"] }
