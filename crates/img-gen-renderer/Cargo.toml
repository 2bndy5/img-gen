[package]
name = "img-gen-renderer"
description = "A library to render images from img-gen-spec"
version = "0.0.0"
readme = "README.md"
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }

[dependencies]
fontawesome-free-pack = "7.2.0"
fontsource_downloader = { workspace = true }
image = "0.25.10"
img-gen-spec = { path = "../img-gen-spec", version = "0.0.0" }
material-design-icons-pack = "7.4.47"
octicons-pack = "19.27.0"
parley = { workspace = true }
pyo3 = { workspace = true, optional = true }
pyo3-async-runtimes = { version = "0.28.0", features = ["tokio-runtime"], optional = true }
# spell-checker: disable-next-line
resvg = { version = "0.47.0", default-features = false, features = ["text", "memmap-fonts", "raster-images"] }
sha2 = "0.11.0"
simple-icons-pack = "16.21.0"
swash = "0.2.7"
thiserror = { workspace = true }
tokio = { workspace = true, optional = true }

[features]
pyo3 = [
	"dep:pyo3",
	"dep:pyo3-async-runtimes",
	"dep:tokio",
	"img-gen-spec/pyo3",
]
