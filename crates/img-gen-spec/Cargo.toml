[package]
name = "img-gen-spec"
version = "0.1.0"
edition = "2024"

[dependencies]
colorgrad = { version = "0.8.0", features = ["named-colors"] }
fontsource_downloader = "0.1.0"
image = "0.25.10"
parley = "0.9.0"
pyo3 = { version = "0.28.3", optional = true, features = ["extension-module", "abi3-py310"] }
regex = "1.12.3"
resvg = "0.47.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.26"
thiserror = "2.0"

[features]
pyo3 = ["dep:pyo3"]
