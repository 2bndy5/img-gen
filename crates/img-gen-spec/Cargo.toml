[package]
name = "img-gen-spec"
description = "An API to create image generator specifications"
version = "0.0.0"
readme = "README.md"
edition = { workspace = true }
license = { workspace = true }
authors = { workspace = true }
repository = { workspace = true }
homepage = { workspace = true }

[dependencies]
colorgrad = { version = "0.8.0", features = ["named-colors"] }
fontsource_downloader = { workspace = true }
image = "0.25.10"
parley = "0.9.0"
pyo3 = { version = "0.28.3", optional = true, features = ["extension-module", "abi3-py310"] }
regex = "1.12.3"
resvg = "0.47.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde-saphyr = "0.0.26"
thiserror = "2.0"

[features]
pyo3 = ["dep:pyo3"]
