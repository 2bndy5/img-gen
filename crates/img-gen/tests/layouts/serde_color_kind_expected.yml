linear:
  colors:
    "0": rgba(0, 0, 0, 1)
    "1": rgba(255, 255, 255, 1)
  start: { x: 0, y: 0 }
  end: { x: 100, y: 0 }
  spread: pad
radial:
  colors:
    "0": rgba(255, 0, 0, 1)
    "1": rgba(0, 0, 255, 1)
  center: { x: 50, y: 50 }
  radius: 100.0
  focal_point: { x: 50, y: 50 }
  focal_radius: 0.0
  spread: pad
conical:
  colors:
    "0": rgba(255, 0, 0, 1)
    "1": rgba(0, 0, 255, 1)
  center: { x: 1, y: 1 }
  angle: 0.0
