layers:
  - background:
      color:
        start: { x: 0, y: 0 }
        end: { x: 100, y: 0 }
        colors: MonoChrome
  - background:
      color:
        radius: 100.0
        center: { x: 50, y: 50 }
        focal_point: { x: 50, y: 50 }
        focal_radius: 0.0
        colors:
          0.0: red
          1.0: blue
  - background:
      color:
        center: { x: 1, y: 1 }
        angle: 0.0
        colors:
          0.0: red
          1.0: blue
