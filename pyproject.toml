[build-system]
requires = ["maturin>=1.13.3,<2.0"]
build-backend = "maturin"

[project]
name = "img-gen"
requires-python = ">=3.10"
license = "MIT"
readme = "README.md"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = []

[tool.maturin]
manifest-path = "crates/img-gen/Cargo.toml"
features = ["pyo3"]
include = ["crates/img-gen/tests/*.py", "LICENSE"]
exclude = ["crates/img-gen/tests/*.rs"]

[tool.mypy]
files = ["img_gen.pyi", "tests/**/*.py"]

[tool.pytest.ini_options]
# spell-checker: disable-next-line
minversion = "6.0"
addopts = "-vv --durations=5"

[dependency-groups]
dev = [
    "maturin==1.13.3",
    "mypy==2.1.0",
    "pre-commit==4.6.0",
    "ruff==0.15.14",
    "asyncio>=4.0.0",
]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=7.4.7,<9",
    "sphinx-immaterial>=0.12.5",
    "sphinx-jinja>=2.0.2",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
