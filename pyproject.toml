[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "img-gen"
requires-python = ">=3.10"
license = "MIT"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "asyncio>=4.0.0",
]

[tool.maturin]
manifest-path = "crates/img-gen/Cargo.toml"
features = ["pyo3"]

[tool.mypy]
files = ["img_gen.pyi", "tests/**/*.py"]

[tool.pytest.ini_options]
# spell-checker: disable-next-line
minversion = "6.0"
addopts = "-vv --durations=5"

[dependency-groups]
dev = [
    "maturin==1.10.1",
    "mypy==2.1.0",
    "pre-commit==4.3.0",
    "ruff==0.15.13",
]
docs = [
    "sphinx>=7.4.7,<9",
    "sphinx-immaterial>=0.12.5",
    "sphinx-jinja>=2.0.2",
]
test = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]
