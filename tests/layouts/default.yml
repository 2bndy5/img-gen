#% block color_vals %#
bg_color: &bg_color '#8bc34b'
fg_color: &fg_color 'white'
#% endblock %#

debug:
  enable: on

layers:
  # the base layer for the background
  - background:
      color: *bg_color
  # the layer for the logo image
  - size: { width: 150, height: 150 }
    offset: { x: 990, y: 60 }
    icon:
      image: tests/message.png
  # the layer for the site's name
  - offset: { x: 60, y: 60 }
    size: { width: 920, height: 60 }
    typography:
      content: 'img-gen'
      align: start center
      color: *fg_color
  # the layer for the page's title
  - size: { width: 920, height: 300 }
    offset: { x: 60, y: 150 }
    typography:
      content: >-
        Testing
      line:
        # height: 0.85
        amount: 3
      font:
        weight: 500
      color: *fg_color
  # the layer for the site's (or page's) description
  - offset: { x: 60, y: 480 }
    size: { width: 1080, height: 90 }
    typography:
      content: >-
        Running a test to generate a filled out layout.
      line:
        height: 0.87
        amount: 2
      align: start bottom
      color: *fg_color
